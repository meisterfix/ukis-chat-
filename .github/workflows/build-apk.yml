name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-Dateien in das Android-Projekt kopieren
        run: npx cap sync android

      - name: Einmal-Signaturschlüssel erzeugen
        # Jeder Bau bekommt einen neuen Schlüssel. Zum Aktualisieren die alte Testversion vorher deinstallieren.
        run: |
          PW=$(openssl rand -hex 24)
          echo "::add-mask::$PW"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/uki.jks" -alias uki -keyalg RSA -keysize 4096 \
            -validity 3650 -storepass "$PW" -keypass "$PW" -dname "CN=UKI CHAT"
          echo "UKI_STORE_FILE=$RUNNER_TEMP/uki.jks" >> "$GITHUB_ENV"
          echo "UKI_STORE_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk UKI-CHAT-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UKI-CHAT-test-apk
          path: UKI-CHAT-test.apk
          retention-days: 14

      - name: APK als Download-Version veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-${{ github.run_number }}"
          gh release create "$TAG" UKI-CHAT-test.apk --repo "${{ github.repository }}" \
            --title "UKI CHAT Testversion ${{ github.run_number }}" --prerelease \
            --notes "Testversion. Vor dem Aktualisieren die alte Version deinstallieren."

      - name: APK zusätzlich im Zweig apk-builds ablegen
        run: |
          mkdir /tmp/apkbranch && cp UKI-CHAT-test.apk /tmp/apkbranch/ && cd /tmp/apkbranch
          git init -q -b apk-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add UKI-CHAT-test.apk
          git commit -q -m "APK aus Lauf ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-builds
