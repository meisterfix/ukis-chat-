name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-Dateien in das Android-Projekt kopieren
        run: npx cap sync android

      - name: Einmal-Signaturschlüssel erzeugen
        # Jeder Bau bekommt einen neuen Schlüssel. Zum Aktualisieren die alte Testversion vorher deinstallieren.
        run: |
          PW=$(openssl rand -hex 24)
          echo "::add-mask::$PW"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/uki.jks" -alias uki -keyalg RSA -keysize 4096 \
            -validity 3650 -storepass "$PW" -keypass "$PW" -dname "CN=UKI CHAT"
          echo "UKI_STORE_FILE=$RUNNER_TEMP/uki.jks" >> "$GITHUB_ENV"
          echo "UKI_STORE_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk UKI-CHAT-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UKI-CHAT-test-apk
          path: UKI-CHAT-test.apk
          retention-days: 14
